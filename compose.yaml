services:
  flagrant:
    build: .
    image: flagrant
    init: true # forwards SIGTERM so `docker compose down` stops at once
    restart: unless-stopped
    ports:
      - "${FLAGRANT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
